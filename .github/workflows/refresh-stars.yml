name: Refresh public-star signal

on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * 1'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/update-stars.mjs
      - name: Commit changed star total
        run: |
          if git diff --quiet -- assets/signal-light.svg assets/signal-dark.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/signal-light.svg assets/signal-dark.svg
          git commit -m 'Refresh public-star signal'
          git push
